[project]
id = "base_window"
version = "0.1.0"
mach = "^5"
src = "src-cn"
out = "out"
#out = "out/{target.name}/{profile.name}"

[target.spirv]
isa = "spirv"
os = "freestanding"
abi = "spirv"
env = "vulkan1.0"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

[dep.boom]
#path = "dep/boom"
git = "https://github.com/briar-systems/boom"
ref = "branch/main"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"

[dep.glfw]
git = "https://github.com/briar-systems/mach-glfw"
ref = "branch/main"

[dep.image]
git = "https://github.com/briar-systems/mach-image"
ref = "branch/main"

[dep.gltf]
git = "https://github.com/briar-systems/mach-gltf"
ref = "branch/main"

# boom links these transitively, but a consumer must still name every dep it
# shares with a path dependency and match its ref exactly.
[dep.audio]
git = "https://github.com/briar-systems/mach-audio"
ref = "branch/main"

[dep.font]
git = "https://github.com/briar-systems/mach-font"
ref = "branch/dev"

[dep.phys]
git = "https://github.com/briar-systems/mach-phys"
ref = "branch/main"

[dep.vk]
git = "https://github.com/briar-systems/mach-vk"
ref = "branch/main"

