[project]
id = "base_window"
version = "0.1.0"
src = "src-cn"
out = "out"
#out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
opt = 0
debug = true
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[dep.boom]
#path = "dep/boom"
git = "https://github.com/briar-systems/boom"
ref = "branch/main"

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"

[dep.mach-glfw]
git = "https://github.com/briar-systems/mach-glfw"
ref = "branch/main"

[dep.mach-image]
git = "https://github.com/briar-systems/mach-image"
ref = "branch/main"

[dep.mach-gltf]
git = "https://github.com/briar-systems/mach-gltf"
ref = "branch/main"

# boom links these transitively, but a consumer must still name every dep it
# shares with a path dependency and match its ref exactly.
[dep.mach-audio]
git = "https://github.com/briar-systems/mach-audio"
ref = "branch/main"

[dep.mach-font]
git = "https://github.com/briar-systems/mach-font"
ref = "branch/dev"

[dep.mach-phys]
git = "https://github.com/briar-systems/mach-phys"
ref = "branch/main"

[dep.mach-vk]
git = "https://github.com/briar-systems/mach-vk"
ref = "branch/main"

# ----------------------------------------------
[artifact.1_hello_window]
kind = "bin"
entry = "1_hello_window.mach"
out = "bin/1_hello_window"
targets = ["*"]
link = []
need = []

[artifact.2_clear_screen]
kind = "bin"
entry = "2_clear_screen.mach"
out = "bin/2_clear_screen"
targets = ["*"]
link = []
need = []

[artifact.3_first_triangle]
